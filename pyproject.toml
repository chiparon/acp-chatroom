[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "acp-chatroom"
version = "0.1.0"
description = "Agent Communication Protocol (ACP) Multi-Agent Chatroom with Explicit Prompt Injection & Silent Message Board"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "websockets>=12.0",
    "rich>=13.0",
    "click>=8.0",
    "pywinpty>=2.0; platform_system=='Windows'",
]

[project.scripts]
acp = "acp.cli:main"
acp-chat = "acp.cli:main"
